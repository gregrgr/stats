name: Windows Rust

on:
  push:
    paths: ['windows/**', '.github/workflows/windows-release.yml']
    tags: ['windows-v*']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows-release.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked
      - name: Smoke test Windows metrics
        run: |
          $p = Start-Process -FilePath target/release/stats-windows.exe -ArgumentList '--self-test' -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test failed: $($p.ExitCode)" }
      - name: Package
        run: |
          New-Item -ItemType Directory -Path dist/Stats-Windows -Force
          Copy-Item target/release/stats-windows.exe, README.md, ../LICENSE dist/Stats-Windows/
          Compress-Archive -Path dist/Stats-Windows/* -DestinationPath dist/Stats-Windows-x86_64.zip
          $hash = (Get-FileHash dist/Stats-Windows-x86_64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Stats-Windows-x86_64.zip" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Stats-Windows-x86_64
          path: windows/dist/*.*
  publish:
    if: startsWith(github.ref, 'refs/tags/windows-v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Stats-Windows-x86_64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          name: Stats for Windows ${{ github.ref_name }}
          make_latest: false
          body: |
            First Rust Windows release: system tray dashboard, CPU/per-core and memory history, disk capacity, network rates, battery status, and process list.

            Windows 10/11 x64 portable build. Extract the ZIP and run stats-windows.exe. Close the dashboard to keep monitoring in the tray; use Show Stats or Quit from its tray menu.

            GPU, hardware sensors, fan control, Bluetooth, timezone clocks, remote monitoring, auto-update and launch at login are not yet implemented. Unsigned executable. SHA256SUMS.txt is included for verification.
          files: dist/*
