[package]
name = "stats-windows"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Stats system monitor for Windows"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence"] }
sysinfo = "0.33"
tray-icon = "0.19"
battery = "0.7"

[profile.release]
lto = "thin"
strip = true
